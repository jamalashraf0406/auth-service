server:
  port: 8082
spring:
  application:
    name: auth-service

  datasource:
    url: jdbc:h2:file:./data/authdb
    driver-class-name: org.h2.Driver
    username: auth
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect
  h2:
    console:
      enabled: true
      path: /h2-console

management:
  endpoints:
    web:
      exposure:
        include: health,info
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    status-page-url: http://${spring.application.name}:${server.port}/actuator/info
    health-check-url: http://${spring.application.name}:${server.port}/actuator/health

logging:
  level:
    org.springframework.security: DEBUG